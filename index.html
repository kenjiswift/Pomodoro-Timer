<!DOCTYPE html>
<html lang="ja" data-theme="neon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ポモドーロ</title>
<script>
/* 画面が一瞬ちらつかないよう、描画前にテーマを当てる */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem("pomo_settings_v1") || "{}");
    if(s && s.theme) document.documentElement.setAttribute("data-theme", s.theme);
  }catch(e){}
})();
</script>
<style>
/* ---------- テーマ ---------- */
:root{color-scheme:dark}
html[data-theme=light]{color-scheme:light}

body{
  --font:"Yu Gothic UI","Meiryo UI","Hiragino Sans",sans-serif;
  --mono:"Consolas","Menlo","Yu Gothic UI","Meiryo UI",monospace;
  --radius:10px; --btn-radius:10px; --tab-radius:8px;
}

/* A. ネオン(既定) */
html[data-theme=neon] body{
  --bg:#070b14; --card:rgba(9,18,32,.88); --text:#d8f6ff; --sub:#5f8aa3; --line:#1b3b55; --faint:#3a5e75;
  --input-bg:#0a1626; --ring-bg:#10273a;
  --accent:#00e5ff; --accent2:#00e5ff; --accent-soft:rgba(0,229,255,.12); --on-accent:#00141a; --glow:rgba(0,229,255,.55);
  --font:var(--mono); --radius:4px; --btn-radius:4px; --tab-radius:4px;
  background-image:linear-gradient(rgba(0,229,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);
  background-size:16px 16px; background-attachment:fixed;
}
html[data-theme=neon] body.short{ --accent:#39ff9f; --accent2:#39ff9f; --accent-soft:rgba(57,255,159,.12); --on-accent:#00170c; --glow:rgba(57,255,159,.5); }
html[data-theme=neon] body.long{ --accent:#b388ff; --accent2:#b388ff; --accent-soft:rgba(179,136,255,.14); --on-accent:#14082a; --glow:rgba(179,136,255,.55); }

/* B. オーロラ */
html[data-theme=aurora] body{
  --bg:#0d0b1a; --card:rgba(255,255,255,.06); --text:#ece8ff; --sub:#b7b0d8; --line:rgba(255,255,255,.13); --faint:#6f6890;
  --input-bg:rgba(255,255,255,.08); --ring-bg:rgba(255,255,255,.1);
  --accent:#ff4da6; --accent2:#7c5cff; --accent-soft:rgba(255,77,166,.14); --on-accent:#fff; --glow:rgba(124,92,255,.45);
  --radius:14px; --btn-radius:12px; --tab-radius:999px;
}
html[data-theme=aurora] body.short{ --accent:#00d4ff; --accent2:#00f5a0; --accent-soft:rgba(0,212,255,.13); --on-accent:#03201d; --glow:rgba(0,212,255,.4); }
html[data-theme=aurora] body.long{ --accent:#7c5cff; --accent2:#00c8ff; --accent-soft:rgba(124,92,255,.16); --on-accent:#fff; --glow:rgba(124,92,255,.45); }

/* C. コックピット */
html[data-theme=cockpit] body{
  --bg:#050505; --card:#0b0b0b; --text:#e8e2d6; --sub:#6d675c; --line:#2a2a2a; --faint:#4a463f;
  --input-bg:#0e0e0e; --ring-bg:#2b2b2b;
  --accent:#ffb000; --accent2:#ffb000; --accent-soft:rgba(255,176,0,.1); --on-accent:#050505; --glow:rgba(255,176,0,.35);
  --font:var(--mono); --radius:2px; --btn-radius:2px; --tab-radius:0;
}
html[data-theme=cockpit] body.short{ --accent:#4cd6a0; --accent2:#4cd6a0; --accent-soft:rgba(76,214,160,.1); --glow:rgba(76,214,160,.35); }
html[data-theme=cockpit] body.long{ --accent:#6fb6ff; --accent2:#6fb6ff; --accent-soft:rgba(111,182,255,.1); --glow:rgba(111,182,255,.35); }

/* D. ライト(従来の見た目) */
html[data-theme=light] body{
  --bg:#faf8f5; --card:#ffffff; --text:#2b2b2b; --sub:#7a7a7a; --line:#e6e1da; --faint:#b5b0a8;
  --input-bg:#fff; --ring-bg:#e6e1da;
  --accent:#e0634f; --accent2:#e0634f; --accent-soft:rgba(224,99,79,.12); --on-accent:#fff; --glow:transparent;
}
html[data-theme=light] body.short{ --accent:#3f9a6b; --accent2:#3f9a6b; --accent-soft:rgba(63,154,107,.12); }
html[data-theme=light] body.long{ --accent:#3d79c2; --accent2:#3d79c2; --accent-soft:rgba(61,121,194,.12); }

/* ---------- 共通 ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  background-color:var(--bg); color:var(--text);
  min-width:120px; min-height:100vh; font-size:13px;
  transition:background-color .4s;
}
/* 終了の合図:画面のふちが光って脈打つ */
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:2; opacity:0;
  background:var(--accent-soft); box-shadow:inset 0 0 50px 6px var(--accent);
}
body.flash::after{ animation:pulse 1s ease-in-out 6; }
@keyframes pulse{ 0%,100%{opacity:0} 50%{opacity:1} }

.wrap{position:relative;z-index:1;padding:6px 6px 20px}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs button{
  flex:1;padding:5px 2px;white-space:nowrap;border:1px solid var(--line);background:var(--card);
  border-radius:var(--tab-radius);font-size:12px;color:var(--sub);cursor:pointer;font-family:inherit;
}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:bold}
.view{display:none}.view.on{display:block}

.mode{text-align:center;font-weight:bold;color:var(--accent);font-size:15px;margin:2px 0 6px}
.ring{position:relative;width:100%;max-width:140px;margin:0 auto}
.ring svg{display:block;width:100%;height:auto;transform:rotate(-90deg);overflow:visible}
.ring .bg{stroke:var(--ring-bg)}
.ring .fg{stroke:url(#ringGrad);transition:stroke-dashoffset .3s linear}
.ring stop.s1{stop-color:var(--accent)}
.ring stop.s2{stop-color:var(--accent2)}
.ring .ticks{display:none}
.ring .ticks line{stroke:var(--ring-bg);transition:stroke .3s}
.ring .ticks line.on{stroke:var(--accent)}
.time{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:clamp(18px,12vw,30px);font-weight:bold;font-variant-numeric:tabular-nums;
}
.time small{font-size:10px;font-weight:normal;color:var(--sub);margin-top:2px}

.btns{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.btns button{
  flex:1 1 40%;padding:8px 2px;white-space:nowrap;border-radius:var(--btn-radius);border:1px solid var(--line);
  background:var(--card);font-size:12px;cursor:pointer;color:var(--text);font-family:inherit;
}
.btns button.main{
  background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:var(--accent);color:var(--on-accent);
  font-weight:bold;flex:1 1 100%;padding:10px 2px;font-size:13px;
}
button:active{transform:translateY(1px)}

.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px;margin:8px 0}
.card h3{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:bold}
.memo-card{border-color:var(--accent);background:var(--accent-soft)}
.memo-card .q{font-weight:bold;margin-bottom:6px}
.row{display:flex;gap:6px}
input[type=text]{
  width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--btn-radius);font-size:14px;
  font-family:inherit;background:var(--input-bg);color:var(--text);
}
input::placeholder{color:var(--faint)}
.small-btn{
  padding:6px 10px;border:1px solid var(--line);background:var(--input-bg);border-radius:var(--btn-radius);
  font-size:12px;cursor:pointer;color:var(--text);white-space:nowrap;font-family:inherit;
}
.small-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.summary{display:flex;justify-content:space-between;align-items:baseline}
.summary b{font-size:18px;color:var(--accent)}
ul.log{list-style:none;margin:6px 0 0;padding:0}
ul.log li{
  display:flex;flex-wrap:wrap;gap:2px 4px;align-items:flex-start;padding:5px 0;border-top:1px dashed var(--line);
  font-size:12px;
}
ul.log li:first-child{border-top:none}
ul.log .t{flex:1;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
ul.log .m{flex:1 1 100%;order:3;word-break:break-all}
ul.log .m.none{color:var(--faint)}
ul.log .x{border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px;padding:0 2px}
ul.log .x:hover{color:var(--accent)}

details.set summary{cursor:pointer;color:var(--sub);font-size:13px}
.set-grid{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;margin-top:8px}
.set-grid input,.set-grid select{
  padding:5px;border:1px solid var(--line);border-radius:var(--btn-radius);font-size:14px;
  background:var(--input-bg);color:var(--text);font-family:inherit;
}
.set-grid input{width:48px;text-align:right}
.set-grid select{max-width:110px;font-size:13px}
.note{font-size:10.5px;color:var(--sub);margin-top:6px;line-height:1.5}

.day{margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.day-head .d{font-weight:bold}
.day-head .s{color:var(--sub);font-size:12px}
.empty{color:var(--sub);text-align:center;padding:20px 0}
/* 通知の案内カード */
.notif-card{border-color:var(--accent)}
.notif-row{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.notif-row b{font-size:12px}
/* 終了時に画面の上に出す大きな案内 */
.overlay{
  position:fixed;inset:0;z-index:4;display:none;align-items:center;justify-content:center;
  padding:12px;background:rgba(0,0,0,.55);
}
html[data-theme=light] .overlay{background:rgba(0,0,0,.35)}
.overlay.on{display:flex}
.ov-box{
  width:100%;max-width:260px;text-align:center;padding:18px 12px;
  background:var(--bg);border:2px solid var(--accent);border-radius:var(--radius);
  box-shadow:0 0 24px var(--glow),0 8px 24px rgba(0,0,0,.4);
}
.ov-title{font-size:18px;font-weight:bold;color:var(--accent);margin-bottom:6px}
.ov-sub{font-size:12px;color:var(--sub);margin-bottom:12px}
.ov-box .small-btn{width:100%;padding:10px;font-size:14px;font-weight:bold}
.toast{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:3;
  background:var(--text);color:var(--bg);padding:7px 12px;border-radius:8px;font-size:12px;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;
}
.toast.on{opacity:.92}

/* ---------- テーマごとの演出 ---------- */
/* ネオン:光る線と文字 */
html[data-theme=neon] .tabs button.on{background:transparent;color:var(--accent);box-shadow:0 0 8px var(--glow),inset 0 0 6px var(--glow)}
html[data-theme=neon] .mode{letter-spacing:.2em;text-shadow:0 0 8px var(--accent)}
html[data-theme=neon] .ring .fg{filter:drop-shadow(0 0 4px var(--accent))}
html[data-theme=neon] .time{color:#eaffff;text-shadow:0 0 10px var(--glow)}
html[data-theme=neon] .btns button:not(.main){background:rgba(0,229,255,.03);color:#9cc9dc}
html[data-theme=neon] .btns button.main{color:var(--on-accent);box-shadow:0 0 14px var(--glow)}
html[data-theme=neon] .card::before{
  content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;
  border-left:2px solid var(--accent);border-top:2px solid var(--accent);
}

/* オーロラ:ぼかした光の背景とガラス風カード */
html[data-theme=aurora] body::before{
  content:"";position:fixed;inset:-40px;pointer-events:none;z-index:0;opacity:.4;filter:blur(14px);
  background:
    radial-gradient(circle at 15% 8%,var(--accent),transparent 40%),
    radial-gradient(circle at 95% 45%,var(--accent2),transparent 45%),
    radial-gradient(circle at 25% 95%,#00c8ff,transparent 45%);
  transition:background .4s;
}
html[data-theme=aurora] .tabs button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent}
html[data-theme=aurora] .mode{color:var(--text)}
html[data-theme=aurora] .time{font-weight:300;color:#fff}
html[data-theme=aurora] .card,
html[data-theme=aurora] .btns button{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
html[data-theme=aurora] .btns button.main{border:none;box-shadow:0 6px 18px var(--glow)}
html[data-theme=aurora] .memo-card{border-color:var(--accent)}

/* コックピット:目盛り式のリングと控えめな線 */
html[data-theme=cockpit] .ring .bg,
html[data-theme=cockpit] .ring .fg{display:none}
html[data-theme=cockpit] .ring .ticks{display:inline}
html[data-theme=cockpit] .ring .ticks line.on{filter:drop-shadow(0 0 2px var(--glow))}
html[data-theme=cockpit] .tabs{gap:0;border-bottom:1px solid var(--line)}
html[data-theme=cockpit] .tabs button{border:none;border-bottom:2px solid transparent;background:none;letter-spacing:.1em}
html[data-theme=cockpit] .tabs button.on{background:none;color:var(--accent);border-bottom-color:var(--accent)}
html[data-theme=cockpit] .mode{font-size:12px;letter-spacing:.35em}
html[data-theme=cockpit] .time{color:#f4efe4;letter-spacing:.04em}
html[data-theme=cockpit] .btns button.main{letter-spacing:.3em}
</style>
</head>
<body class="focus">
<div class="wrap">
  <div class="tabs">
    <button id="tabTimer" class="on">タイマー</button>
    <button id="tabHist">履歴</button>
  </div>

  <!-- タイマー画面 -->
  <div id="viewTimer" class="view on">
    <div class="mode" id="modeLabel">集中</div>
    <div class="ring">
      <svg viewBox="0 0 120 120">
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop class="s1" offset="0"></stop><stop class="s2" offset="1"></stop>
          </linearGradient>
        </defs>
        <circle class="bg" cx="60" cy="60" r="54" fill="none" stroke-width="8"></circle>
        <circle class="fg" id="fg" cx="60" cy="60" r="54" fill="none" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="339.292" stroke-dashoffset="0"></circle>
        <g class="ticks" id="ticks"></g>
      </svg>
      <div class="time"><span id="timeText">25:00</span><small id="subText">今日 0回</small></div>
    </div>

    <div class="btns">
      <button id="btnMain" class="main">開始</button>
      <button id="btnSkip" title="今の区間を終えて次へ">次へ</button>
      <button id="btnReset" title="今の区間をやり直す">リセット</button>
    </div>

    <div id="notifCard" class="card notif-card" style="display:none">
      <div class="notif-row">
        <b id="notifCardTitle">デスクトップ通知がオフです</b>
        <button class="small-btn primary" id="notifOn">オンにする</button>
        <a class="small-btn primary" id="siteLink" href="https://kenjiswift.github.io/Pomodoro-Timer/" target="_blank" rel="noopener" style="text-decoration:none">サイト版を開く</a>
      </div>
      <div class="note" id="notifCardNote">オンにすると、終了時に画面の右下にメールのような通知が出ます。</div>
    </div>

    <div id="memoCard" class="card memo-card" style="display:none">
      <div class="q">何を片付けた?(任意)</div>
      <div class="row">
        <input type="text" id="memoInput" placeholder="一行でOK。空でも大丈夫">
      </div>
      <div class="row" style="margin-top:6px">
        <button class="small-btn primary" id="memoSave">保存</button>
        <button class="small-btn" id="memoSkip">スキップ</button>
      </div>
    </div>

    <div class="card">
      <div class="summary"><h3 style="margin:0">今日</h3><div><b id="todayCount">0</b>回 / <span id="todayMins">0</span>分</div></div>
      <ul class="log" id="todayLog"></ul>
    </div>

    <div class="card">
      <details class="set">
        <summary>設定</summary>
        <div class="set-grid">
          <label for="setTheme">テーマ</label>
          <select id="setTheme">
            <option value="neon">ネオン</option>
            <option value="aurora">オーロラ</option>
            <option value="cockpit">コックピット</option>
            <option value="light">ライト</option>
          </select>
          <label for="setFocus">集中(分)</label><input type="number" id="setFocus" min="1" max="180">
          <label for="setShort">休憩(分)</label><input type="number" id="setShort" min="1" max="60">
          <label for="setLong">長い休憩(分)</label><input type="number" id="setLong" min="1" max="120">
          <label for="setEvery">長い休憩の間隔(回)</label><input type="number" id="setEvery" min="2" max="10">
        </div>
        <div class="note">テーマはすぐ切り替わります。時間の変更は、動いていない区間にはすぐ反映され、動作中の区間には次から反映されます。</div>
      </details>
    </div>

    <div class="note" id="notifNote"></div>
    <div class="row" style="margin-top:6px">
      <button class="small-btn" id="notifTest">通知テスト</button>
    </div>
    <div class="card">
      <details class="set" id="diagBox">
        <summary>通知がうまくいかない時(診断)</summary>
        <ul class="log" id="diagList"></ul>
        <div class="row" style="margin-top:6px">
          <button class="small-btn" id="diagCopy">診断結果をコピー</button>
        </div>
        <div class="note">うまくいかない時は、ここをコピーして伝えてください。</div>
      </details>
    </div>
  </div>

  <!-- 履歴画面 -->
  <div id="viewHist" class="view">
    <div class="row" style="margin-bottom:8px">
      <button class="small-btn primary" id="copyAll">全部コピー</button>
      <button class="small-btn" id="clearAll">全削除</button>
    </div>
    <div id="histBody"></div>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="ov-box">
    <div class="ov-title" id="ovTitle">集中おわり!</div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="small-btn primary" id="ovOk">OK</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 保存まわり(localStorageが使えなくても動く) ---------- */
  var mem = {};
  var store = {
    get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in mem)? mem[k] : null; } },
    set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
  };
  function load(k, def){
    try{ var s = store.get(k); return s ? JSON.parse(s) : def; }catch(e){ return def; }
  }
  function save(k, v){ store.set(k, JSON.stringify(v)); }

  var KEY_SET="pomo_settings_v1", KEY_STATE="pomo_state_v1", KEY_LOG="pomo_log_v1";
  var settings = Object.assign({focus:25, short:5, long:15, every:4, theme:"neon"}, load(KEY_SET, {}));
  var log = load(KEY_LOG, []);
  var state = load(KEY_STATE, null);
  var pendingMemoId = null;

  function dur(mode){ return settings[mode] * 60000; }

  if(!state || !state.mode){
    state = {mode:"focus", running:false, endAt:null, remainMs:dur("focus"), totalMs:dur("focus"), cycle:0};
  }

  /* ---------- テーマ ---------- */
  var THEMES = ["neon","aurora","cockpit","light"];
  function applyTheme(){
    if(THEMES.indexOf(settings.theme) < 0) settings.theme = "neon";
    document.documentElement.setAttribute("data-theme", settings.theme);
    $("setTheme").value = settings.theme;
  }

  /* コックピット用の目盛り(60本) */
  var TICKS = 60, tickEls = [];
  (function buildTicks(){
    var g = $("ticks"), ns = "http://www.w3.org/2000/svg";
    for(var i=0;i<TICKS;i++){
      var a = i/TICKS*Math.PI*2, big = i%5===0;
      var r1 = 47, r2 = big ? 57 : 53;
      var l = document.createElementNS(ns, "line");
      l.setAttribute("x1", 60+r1*Math.cos(a)); l.setAttribute("y1", 60+r1*Math.sin(a));
      l.setAttribute("x2", 60+r2*Math.cos(a)); l.setAttribute("y2", 60+r2*Math.sin(a));
      l.setAttribute("stroke-width", big ? 2.4 : 1.4);
      g.appendChild(l); tickEls.push(l);
    }
  })();

  /* ---------- 日付ユーティリティ ---------- */
  function pad(n){ return (n<10?"0":"")+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function timeStr(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
  var WD = ["日","月","火","水","木","金","土"];
  function dayLabel(key){
    var p = key.split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")";
  }
  function fmt(ms){
    var s = Math.ceil(ms/1000); if(s<0) s=0;
    return pad(Math.floor(s/60))+":"+pad(s%60);
  }

  /* ---------- タイマー本体 ---------- */
  var MODE_NAME = {focus:"集中", short:"休憩", long:"長い休憩"};
  var CIRC = 339.292;

  function remaining(){
    return state.running ? Math.max(0, state.endAt - Date.now()) : state.remainMs;
  }
  function persistState(){ save(KEY_STATE, state); }

  function setMode(mode){
    state.mode = mode;
    state.running = false;
    state.endAt = null;
    state.totalMs = dur(mode);
    state.remainMs = state.totalMs;
    persistState();
  }

  function start(){
    if(state.running) return;
    maybeAskNotification();
    stopAlert();
    state.endAt = Date.now() + state.remainMs;
    state.running = true;
    persistState();
    render();
  }
  function pause(){
    if(!state.running) return;
    state.remainMs = Math.max(0, state.endAt - Date.now());
    state.running = false;
    state.endAt = null;
    persistState();
    render();
  }
  function reset(){
    stopAlert();
    setMode(state.mode);
    render();
  }
  function nextModeAfter(mode){
    if(mode === "focus"){
      return (state.cycle % settings.every === 0) ? "long" : "short";
    }
    return "focus";
  }
  function skip(){
    stopAlert();
    if(state.mode === "focus"){
      // 途中で次へ進む場合は、回数には数えない
      setMode("short");
    }else{
      setMode("focus");
    }
    render();
  }

  function finish(){
    var finished = state.mode;
    if(finished === "focus"){
      state.cycle += 1;
      var now = new Date();
      var entry = {
        id: now.getTime()+"-"+Math.floor(Math.random()*1000),
        date: dateKey(now), time: timeStr(now),
        mins: Math.round(state.totalMs/60000), memo: ""
      };
      log.push(entry);
      save(KEY_LOG, log);
      pendingMemoId = entry.id;
    }
    setMode(nextModeAfter(finished));
    alertUser(finished);
    render();
  }

  /* ---------- 終了の合図(音なし) ---------- */
  var blinkTimer = null, blinkOn = false, lastNotif = null;
  function alertUser(finished){
    var title = finished === "focus" ? "集中おわり!" : "休憩おわり!";
    var msg = finished === "focus" ? "おつかれさま。休憩しましょう" : "次の集中へ";
    document.body.classList.remove("flash");
    void document.body.offsetWidth;
    document.body.classList.add("flash");
    startBlink("★ " + title);
    $("ovTitle").textContent = title;
    $("ovSub").textContent = msg;
    $("overlay").classList.add("on");
    showDesktop((finished === "focus" ? "🍅 " : "☕ ") + title, msg);
  }
  /* デスクトップ通知(右下に出るもの)。閉じるまで残す */
  function showDesktop(title, body){
    try{
      if(notifState() !== "granted") return false;
      closeDesktop();
      var n = new Notification(title, {body: body, silent: true, requireInteraction: true, tag: "pomodoro"});
      n.onclick = function(){ try{ window.focus(); }catch(e){} n.close(); };
      diag.notif = "送信した(表示の合図待ち)";
      n.onshow = function(){ diag.notif = "ブラウザは「表示した」と報告(" + timeStr(new Date()) + ")"; renderDiag(); };
      n.onerror = function(){ diag.notif = "エラー:ブラウザが表示を拒否(" + timeStr(new Date()) + ")"; renderDiag(); };
      lastNotif = n;
      return true;
    }catch(e){ diag.notif = "エラー:" + e.message; renderDiag(); return false; }
  }
  function closeDesktop(){
    if(lastNotif){ try{ lastNotif.close(); }catch(e){} lastNotif = null; }
  }
  function startBlink(text){
    stopBlink();
    var count = 0;
    blinkTimer = setInterval(function(){
      blinkOn = !blinkOn;
      document.title = blinkOn ? text : "ポモドーロ";
      if(++count > 60){ stopBlink(); }
    }, 700);
  }
  function stopBlink(){
    if(blinkTimer){ clearInterval(blinkTimer); blinkTimer = null; }
    updateTitle();
  }
  function stopAlert(){
    document.body.classList.remove("flash");
    $("overlay").classList.remove("on");
    closeDesktop();
    stopBlink();
  }

  function notifState(){
    try{
      // ファイルとして開いたページは、ブラウザが通知の許可を記録できない
      if(location.protocol === "file:") return "file";
      if(!("Notification" in window)) return "unsupported";
      return Notification.permission;
    }catch(e){ return "unsupported"; }
  }
  function askNotification(then){
    try{
      // 古いブラウザはコールバック、新しいブラウザはPromiseで返るので、1回だけ処理する
      var called = false, t0 = Date.now();
      diag.ask = "押した(" + clockStr(new Date()) + ")。ブラウザの返事待ち…";
      renderDiag();
      // 確認画面が出ない(アドレスバーのアイコンに隠れる)と、返事が来ないまま止まる
      setTimeout(function(){
        if(called) return;
        askWaiting = true;
        diag.ask = "押した(" + clockStr(new Date(t0)) + ")が、4秒以上ブラウザから返事がない";
        renderNotifNote();
      }, 4000);
      var done = function(result){
        if(called) return; called = true; askWaiting = false;
        diag.ask = (result || Notification.permission) + "(" + (Date.now() - t0) + "ミリ秒で返答)";
        lastAsk = result || Notification.permission;
        renderNotifNote();
        if(lastAsk === "default") toast("許可の確認が出なかったか、閉じられました");
        if(then) then();
      };
      var p = Notification.requestPermission(done);
      if(p && p.then){ p.then(done); }
    }catch(e){ renderNotifNote(); }
  }
  function maybeAskNotification(){
    if(notifState() === "default") askNotification();
  }
  function testNotification(){
    if(notifState() === "default"){
      askNotification(function(){ if(notifState() === "granted") testNotification(); });
      return;
    }
    if(showDesktop("🍅 ポモドーロ", "通知テストです。終了時はこのように表示されます")){
      toast("通知を送りました");
    }else{
      toast("通知を出せませんでした");
    }
  }
  var diag = {ask:"まだ押していない", notif:"まだ送っていない", query:"確認中"}, lastAsk = null, askWaiting = false;
  function clockStr(d){ return timeStr(d) + ":" + pad(d.getSeconds()); }
  var PERM_JA = {granted:"許可", denied:"ブロック", "default":"未設定(まだ許可していない)", file:"ファイル版のため使えない", unsupported:"このブラウザは非対応"};
  function browserName(){
    var u = navigator.userAgent;
    var m = u.match(/Edg\/([\d]+)/); if(m) return "Edge " + m[1];
    m = u.match(/Chrome\/([\d]+)/); if(m) return "Chrome " + m[1];
    m = u.match(/Firefox\/([\d]+)/); if(m) return "Firefox " + m[1];
    return "その他";
  }
  function diagLines(){
    var st = notifState();
    return [
      ["開き方", location.protocol === "file:" ? "ファイル版" : "サイト版(" + location.host + ")"],
      ["ブラウザ", browserName()],
      ["通知の許可", PERM_JA[st] || st],
      ["許可の状態(別の確認方法)", diag.query],
      ["「オンにする」の結果", diag.ask],
      ["最後の通知", diag.notif],
      ["ページ表示中", document.visibilityState === "visible" ? "はい" : "いいえ"]
    ];
  }
  function renderDiag(){
    var ul = $("diagList"); if(!ul) return;
    ul.innerHTML = "";
    diagLines().forEach(function(r){
      var li = document.createElement("li");
      var a = document.createElement("span"); a.className = "t"; a.textContent = r[0];
      var b = document.createElement("span"); b.className = "m"; b.textContent = r[1];
      li.appendChild(a); li.appendChild(b); ul.appendChild(li);
    });
  }
  function refreshQuery(){
    try{
      if(navigator.permissions && navigator.permissions.query){
        navigator.permissions.query({name:"notifications"}).then(function(r){
          diag.query = r.state; renderDiag();
          r.onchange = function(){ diag.query = r.state; if(r.state !== "prompt") askWaiting = false; renderNotifNote(); };
        }, function(e){ diag.query = "取得できない(" + e.message + ")"; renderDiag(); });
        return;
      }
    }catch(e){}
    diag.query = "取得できない"; renderDiag();
  }
  function renderNotifNote(){
    var st = notifState();
    var t = "終了時は、画面中央の案内・画面のふちの光・タブのタイトルでお知らせします(音は鳴りません)。";
    var card = "";
    if(st === "granted"){
      t += " デスクトップ通知もオンです(閉じるまで右下に残ります)。通知テストで出ない場合は、Windowsの「設定 → システム → 通知」でブラウザの通知がオンか、「応答不可(集中モード)」がオフかを確認してください。";
    }else if(st === "denied"){
      card = "ブラウザで通知がブロックされています。アドレスバー左のアイコン →「通知」(またはサイトのアクセス許可)を「許可」にして、ページを再読み込みしてください。項目が選べない場合は、会社の設定で通知が禁止されている可能性があります。";
    }else if(st === "file"){
      card = "ファイルを直接開いているため、ブラウザの仕様で右下の通知は使えません。「サイト版を開く」から開くと使えます。履歴はファイル版と別になるので、必要なら履歴画面の「全部コピー」で控えてください。";
    }else if(st === "unsupported"){
      card = "この環境ではデスクトップ通知が使えません。終了時は画面中央に大きく表示します。";
    }else if(askWaiting){
      card = "許可の確認が、アドレスバーの中の小さなベルのアイコン(斜線入りのことも)に隠れています。それを押して「許可」を選んでください。";
    }else if(lastAsk === "default"){
      card = "許可の確認が出なかったか、閉じられました。アドレスバーに斜線の入ったベルのアイコンが出ていたら、それを押して「許可」を選んでください。アイコンも出ない場合は、Edgeの「設定 → Cookieとサイトのアクセス許可 → 通知」で「送信する前に確認する」がオンか、「静かな通知要求」がオフかを確認してください。";
    }else{
      card = "オンにすると、終了時に画面の右下にメールのような通知が出ます。";
    }
    $("notifNote").textContent = t;
    renderDiag();
    $("notifCard").style.display = st === "granted" ? "none" : "block";
    $("notifCardNote").textContent = card;
    $("notifCardTitle").textContent = st === "file" ? "このファイルでは右下の通知が出ません" : "デスクトップ通知がオフです";
    $("siteLink").style.display = st === "file" ? "" : "none";
    $("notifOn").style.display = st === "default" ? "" : "none";
    $("notifTest").style.display = st === "granted" ? "" : "none";
  }

  /* ---------- 描画 ---------- */
  function updateTitle(){
    if(blinkTimer) return;
    if(state.running){
      document.title = (state.mode==="focus" ? "🍅 " : "☕ ") + fmt(remaining()) + " " + MODE_NAME[state.mode];
    }else{
      document.title = "ポモドーロ";
    }
  }
  function todayEntries(){
    var k = dateKey(new Date());
    return log.filter(function(e){ return e.date === k; });
  }
  function render(){
    document.body.classList.remove("focus","short","long");
    document.body.classList.add(state.mode);
    var rem = remaining();
    $("modeLabel").textContent = MODE_NAME[state.mode] + (state.running ? "" : (rem===state.totalMs ? "(待機中)" : "(一時停止)"));
    $("timeText").textContent = fmt(rem);
    var prog = state.totalMs > 0 ? 1 - rem/state.totalMs : 0;
    $("fg").style.strokeDashoffset = String(CIRC * prog);
    var lit = Math.ceil(TICKS * (1 - prog) - 1e-9);
    tickEls.forEach(function(l, i){ l.classList.toggle("on", i < lit); });
    var te = todayEntries();
    $("subText").textContent = "今日 " + te.length + "回";
    $("btnMain").textContent = state.running ? "一時停止" : (rem===state.totalMs ? "開始" : "再開");
    updateTitle();
    renderToday();
    renderMemoCard();
    if($("viewHist").classList.contains("on")) renderHist();
  }

  function makeLogItem(e, withDelete){
    var li = document.createElement("li");
    var t = document.createElement("span"); t.className="t"; t.textContent = e.time + " " + e.mins + "分";
    var m = document.createElement("span"); m.className="m" + (e.memo ? "" : " none");
    m.textContent = e.memo || "(メモなし)";
    li.appendChild(t); li.appendChild(m);
    if(withDelete){
      var x = document.createElement("button"); x.className="x"; x.textContent="✕"; x.title="削除";
      x.addEventListener("click", function(){ removeEntry(e.id); });
      li.appendChild(x);
    }
    return li;
  }
  function renderToday(){
    var te = todayEntries();
    var ul = $("todayLog"); ul.innerHTML = "";
    var total = 0;
    te.forEach(function(e){ total += e.mins; });
    $("todayCount").textContent = te.length;
    $("todayMins").textContent = total;
    if(te.length === 0){
      var li = document.createElement("li");
      li.style.color = "var(--sub)"; li.textContent = "まだありません";
      ul.appendChild(li); return;
    }
    te.slice().reverse().forEach(function(e){ ul.appendChild(makeLogItem(e, true)); });
  }
  function renderMemoCard(){
    var show = false;
    if(pendingMemoId){
      show = log.some(function(e){ return e.id === pendingMemoId; });
      if(!show) pendingMemoId = null;
    }
    $("memoCard").style.display = show ? "block" : "none";
  }

  function removeEntry(id){
    log = log.filter(function(e){ return e.id !== id; });
    save(KEY_LOG, log);
    if(pendingMemoId === id) pendingMemoId = null;
    render();
  }

  /* ---------- 履歴画面 ---------- */
  function groupByDate(){
    var map = {};
    log.forEach(function(e){ (map[e.date] = map[e.date] || []).push(e); });
    return Object.keys(map).sort().reverse().map(function(k){ return {key:k, items:map[k]}; });
  }
  function dayText(g){
    var total = 0; g.items.forEach(function(e){ total += e.mins; });
    var lines = [dayLabel(g.key) + " " + g.items.length + "回 " + total + "分"];
    g.items.forEach(function(e){
      lines.push("  " + e.time + " " + e.mins + "分" + (e.memo ? " " + e.memo : ""));
    });
    return lines.join("\n");
  }
  function renderHist(){
    var body = $("histBody"); body.innerHTML = "";
    var groups = groupByDate();
    if(groups.length === 0){
      var d = document.createElement("div"); d.className="empty"; d.textContent="まだ履歴がありません";
      body.appendChild(d); return;
    }
    groups.forEach(function(g){
      var total = 0; g.items.forEach(function(e){ total += e.mins; });
      var card = document.createElement("div"); card.className = "card day";
      var head = document.createElement("div"); head.className = "day-head";
      var d = document.createElement("span"); d.className="d"; d.textContent = dayLabel(g.key);
      var s = document.createElement("span"); s.className="s"; s.textContent = g.items.length + "回 / " + total + "分";
      var cp = document.createElement("button"); cp.className="small-btn"; cp.textContent="コピー";
      cp.addEventListener("click", function(){ copyText(dayText(g)); });
      head.appendChild(d); head.appendChild(s); head.appendChild(cp);
      card.appendChild(head);
      var ul = document.createElement("ul"); ul.className="log";
      g.items.forEach(function(e){ ul.appendChild(makeLogItem(e, true)); });
      card.appendChild(ul);
      body.appendChild(card);
    });
  }

  function copyText(text){
    function done(){ toast("コピーしました"); }
    function fallback(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){ toast("コピーできませんでした"); }
      document.body.removeChild(ta);
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, fallback);
      }else{ fallback(); }
    }catch(e){ fallback(); }
  }
  var toastTimer = null;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 1600);
  }

  /* ---------- イベント ---------- */
  $("btnMain").addEventListener("click", function(){ state.running ? pause() : start(); });
  $("btnSkip").addEventListener("click", skip);
  $("btnReset").addEventListener("click", reset);
  $("ovOk").addEventListener("click", stopAlert);
  $("overlay").addEventListener("click", function(ev){ if(ev.target === this) stopAlert(); });
  $("notifOn").addEventListener("click", testNotification);
  $("notifTest").addEventListener("click", testNotification);
  $("diagCopy").addEventListener("click", function(){
    copyText(diagLines().map(function(r){ return r[0] + ": " + r[1]; }).join("\n"));
  });
  window.addEventListener("focus", renderNotifNote);

  $("tabTimer").addEventListener("click", function(){ switchView("Timer"); });
  $("tabHist").addEventListener("click", function(){ switchView("Hist"); });
  function switchView(name){
    $("viewTimer").classList.toggle("on", name==="Timer");
    $("viewHist").classList.toggle("on", name==="Hist");
    $("tabTimer").classList.toggle("on", name==="Timer");
    $("tabHist").classList.toggle("on", name==="Hist");
    if(name==="Hist") renderHist();
  }

  function saveMemo(){
    var v = $("memoInput").value.trim();
    var e = log.filter(function(x){ return x.id === pendingMemoId; })[0];
    if(e){ e.memo = v; save(KEY_LOG, log); }
    pendingMemoId = null;
    $("memoInput").value = "";
    render();
  }
  $("memoSave").addEventListener("click", saveMemo);
  $("memoSkip").addEventListener("click", function(){ pendingMemoId = null; $("memoInput").value=""; render(); });
  $("memoInput").addEventListener("keydown", function(ev){ if(ev.key === "Enter"){ saveMemo(); } });

  $("copyAll").addEventListener("click", function(){
    var groups = groupByDate();
    if(groups.length === 0){ toast("コピーする履歴がありません"); return; }
    copyText(groups.map(dayText).join("\n\n"));
  });
  $("clearAll").addEventListener("click", function(){
    if(log.length === 0) return;
    if(confirm("履歴をすべて削除します。元に戻せません。よろしいですか?")){
      log = []; save(KEY_LOG, log); pendingMemoId = null; render();
    }
  });

  /* 設定 */
  $("setTheme").addEventListener("change", function(){
    settings.theme = $("setTheme").value;
    save(KEY_SET, settings);
    applyTheme();
  });
  var fields = {focus:"setFocus", short:"setShort", long:"setLong", every:"setEvery"};
  function fillSettings(){
    Object.keys(fields).forEach(function(k){ $(fields[k]).value = settings[k]; });
  }
  Object.keys(fields).forEach(function(k){
    $(fields[k]).addEventListener("change", function(){
      var el = $(fields[k]);
      var min = +el.min, max = +el.max;
      var v = Math.round(+el.value);
      if(!isFinite(v) || v < min) v = min;
      if(v > max) v = max;
      el.value = v;
      settings[k] = v;
      save(KEY_SET, settings);
      // 待機中(未開始)の区間には、その場で反映
      if(!state.running && k === state.mode && remaining() === state.totalMs){
        state.totalMs = dur(state.mode); state.remainMs = state.totalMs; persistState();
      }
      render();
    });
  });

  /* 日付が変わった時・復帰した時に表示を更新 */
  document.addEventListener("visibilitychange", function(){ tick(); });
  window.addEventListener("focus", function(){ stopBlink(); tick(); });
  document.addEventListener("click", function(){ if(blinkTimer) stopBlink(); });

  function tick(){
    if(state.running && state.endAt - Date.now() <= 0){ finish(); return; }
    render();
  }

  /* ---------- 起動 ---------- */
  applyTheme();
  fillSettings();
  renderNotifNote();
  refreshQuery();
  // 前回の起動中に終了時刻を過ぎていた場合
  if(state.running && state.endAt - Date.now() <= 0){
    finish();
  }else{
    render();
  }
  setInterval(tick, 500);
})();
</script>
</body>
</html>
